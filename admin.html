<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Prayer Wall Admin</title><link rel="stylesheet" href="css/styles.css"/></head>
<body class="admin-page">
  <div id="loginView" class="login-card">
    <div class="brand-lockup"><img class="logo" src="assets/solid-rock-logo.png" alt="Solid Rock Dublin logo"/><div class="brand-text">Prayer Wall<small>Admin</small></div></div>
    <p>Sign in with the Firebase admin account configured for this event.</p>
    <input id="email" type="email" placeholder="Admin email"/>
    <input id="password" type="password" placeholder="Password"/>
    <button id="loginBtn">Sign in</button>
    <p id="loginMsg"></p>
  </div>
  <main id="adminView" class="admin-shell" hidden>
    <div class="admin-top">
      <div><h1 style="font-family:inherit;font-size:2rem;margin:0">Prayer Wall Admin</h1><div id="countLabel" style="color:#d8c49e;margin-top:5px">0 names</div></div>
      <div class="admin-actions"><button id="downloadBtn">Download CSV</button><button id="refreshBtn">Refresh</button><button id="clearBtn" class="danger">Clear all</button><button id="logoutBtn">Sign out</button></div>
    </div>
    <section id="adminGrid" class="admin-grid"></section>
  </main>
  <script src="js/config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
