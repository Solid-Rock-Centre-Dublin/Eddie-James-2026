<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Live Prayer Wall | Solid Rock Dublin</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="display-page">
  <div class="display-bg"></div>
  <header class="display-header">
    <img class="logo" src="assets/solid-rock-logo.png" alt="Solid Rock Dublin logo"/>
    <div class="brand-text">Solid Rock Dublin<small>Presents</small></div>
  </header>
  <section class="display-title">
    <div class="eyebrow">Invite · Pray · Believe</div>
    <h2>Who are you <span>inviting?</span></h2>
  </section>

  <main id="nameStage" class="name-stage" aria-live="polite"></main>

  <aside class="qr-panel" aria-label="Scan to add a name">
    <div id="qrcode" class="qr"></div>
    <strong>Scan to add a name</strong>
    <small>Up to 3 invitees per person</small>
  </aside>

  <footer class="display-footer">
    <div class="event-info"><strong>SOUNDS OF REVIVAL</strong> · 17–18 SEPTEMBER 2026 · 7PM DAILY</div>
    <div class="live-badge"><i></i><span>Names appearing live</span></div>
  </footer>

  <script src="js/config.js"></script>
  <script type="module" src="js/display.js"></script>
</body>
</html>
